<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111114">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<title>뮤직 · 연결</title>
<style>
  html, body { margin: 0; height: 100%; background: #111114; color: #f3f3f5;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Segoe UI", sans-serif; }
  body { display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
  form { width: 100%; max-width: 320px; text-align: center; }
  img { width: 84px; height: 84px; border-radius: 20px; }
  h1 { font-size: 24px; margin: 16px 0 6px; }
  p { color: #9a9aa5; margin: 0 0 24px; line-height: 1.5; font-size: 15px; }
  input { width: 100%; box-sizing: border-box; font-size: 32px; letter-spacing: 12px; text-align: center;
    padding: 14px; border-radius: 14px; border: 1px solid #2a2a31; background: #1c1c21; color: #fff; outline: none; }
  button { margin-top: 14px; width: 100%; padding: 15px; border: 0; border-radius: 14px; background: #ff5a5f;
    color: #fff; font-size: 17px; font-weight: 600; }
  .err { color: #ff5a5f; margin-top: 12px; font-size: 14px; display: none; }
</style>
</head>
<body>
<form method="post" action="/login">
  <img src="/icons/icon-192.png" alt="">
  <h1>PC에 연결</h1>
  <p>PC의 뮤직 프로그램에 표시된<br>4자리 PIN을 입력하세요.</p>
  <input name="pin" inputmode="numeric" pattern="[0-9]*" maxlength="8" autocomplete="one-time-code" autofocus required>
  <button type="submit">연결</button>
  <div class="err" id="err">PIN이 맞지 않아요. 다시 확인해 주세요.</div>
</form>
<script>if (location.search.includes('wrong')) document.getElementById('err').style.display = 'block';</script>
</body>
</html>
