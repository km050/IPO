name: Build Windows app

on:
  push:
    branches: [main]
    paths: ['desktop/**', '.github/workflows/build-windows.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools
        run: pip install pyinstaller qrcode mutagen

      - name: Build MusicPlayer.exe
        working-directory: desktop
        run: >
          pyinstaller --noconfirm --onefile --windowed --name MusicPlayer
          --icon icons/app.ico
          --add-data "player.html;."
          --add-data "login.html;."
          --add-data "manifest.webmanifest;."
          --add-data "icons;icons"
          app.py

      - name: Publish to "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest desktop/dist/MusicPlayer.exe \
            --title "뮤직 (Windows)" \
            --notes "MusicPlayer.exe 를 받아서 실행하세요. 설치가 필요 없습니다."
